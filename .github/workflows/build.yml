name: Compiler scanner.exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install colorama rich pyinstaller

      - name: Compiler le programme
        run: |
          pyinstaller --clean --onefile --console --name scanner scanner.py

      - name: Publier le fichier EXE
        uses: actions/upload-artifact@v4
        with:
          name: scanner-windows
          path: dist/scanner.exe
